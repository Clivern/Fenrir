[project]
name = "ferir"
version = "0.2.0"
description = "Point an agent at a repository. Get a patch you can ship."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Clivern" }]
keywords = ["pi", "coding-agent", "docker", "git", "diff"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Clivern/Fenrir"
Repository = "https://github.com/Clivern/Fenrir"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits the network"]

[tool.ruff]
line-length = 110
