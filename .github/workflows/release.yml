name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match project version $version" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
